<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#7c5cfc">
  <title>MQ Messenger</title>
  <link rel="icon" type="image/png" href="/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Login Screen -->
    <div id="login-screen" class="screen active">
      <div class="login-container">
        <div class="login-logo">
          <img src="/icon-120.png" alt="MQ" class="logo-img">
        </div>
        <h1 class="login-title">MQ Messenger</h1>
        <p class="login-subtitle">Быстрый и безопасный мессенджер</p>
        <div class="glass-card login-form">
          <div id="phone-step">
            <label class="input-label">Номер телефона</label>
            <input type="tel" id="phone-input" class="glass-input" placeholder="+7 (999) 000-00-00">
            <button id="send-code-btn" class="glass-btn primary" onclick="sendCode()">Получить код</button>
          </div>
          <div id="code-step" style="display:none">
            <label class="input-label">Код подтверждения</label>
            <input type="text" id="code-input" class="glass-input" placeholder="0000" maxlength="4">
            <p class="hint-text">Введите 0000 или 1234 для входа</p>
            <button class="glass-btn primary" onclick="verifyCode()">Войти</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Main App -->
    <div id="main-screen" class="screen">
      <div class="app-layout">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
          <div class="sidebar-header">
            <div class="sidebar-title">
              <img src="/icon-40.png" alt="MQ" class="sidebar-logo">
              <span>MQ</span>
            </div>
            <button class="icon-btn" onclick="showNewChatModal()" title="Новый чат">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
          </div>
          <div class="search-container">
            <input type="text" id="chat-search" class="glass-input search" placeholder="Поиск..." oninput="filterChats(this.value)">
          </div>
          <div id="chat-list" class="chat-list"></div>
          <nav class="sidebar-nav">
            <button class="nav-btn active" data-tab="chats" onclick="switchTab('chats')">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              <span>Чаты</span>
            </button>
            <button class="nav-btn" data-tab="contacts" onclick="switchTab('contacts')">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              <span>Контакты</span>
            </button>
            <button class="nav-btn" data-tab="profile" onclick="switchTab('profile')">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <span>Профиль</span>
            </button>
          </nav>
        </aside>

        <!-- Contacts Panel (hidden by default) -->
        <div id="contacts-panel" class="contacts-panel" style="display:none">
          <div class="panel-header">
            <h2>Контакты</h2>
            <button class="icon-btn" onclick="switchTab('chats')">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <input type="text" id="contact-search" class="glass-input search" placeholder="Поиск пользователей..." oninput="searchUsers(this.value)">
          <div id="contacts-list" class="contacts-list"></div>
          <div id="search-results" class="contacts-list" style="display:none"></div>
        </div>

        <!-- Profile Panel (hidden by default) -->
        <div id="profile-panel" class="profile-panel" style="display:none">
          <div class="panel-header">
            <h2>Профиль</h2>
            <button class="icon-btn" onclick="switchTab('chats')">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <div class="profile-content">
            <div class="profile-avatar-section">
              <div id="profile-avatar" class="avatar-large"></div>
              <label class="avatar-upload-btn">
                <input type="file" accept="image/*" onchange="uploadAvatar(this.files[0])" hidden>
                Изменить фото
              </label>
            </div>
            <div class="glass-card profile-fields">
              <div class="field-group">
                <label>Имя</label>
                <input type="text" id="profile-name" class="glass-input" placeholder="Ваше имя">
              </div>
              <div class="field-group">
                <label>Имя пользователя</label>
                <input type="text" id="profile-username" class="glass-input" placeholder="@username">
              </div>
              <div class="field-group">
                <label>О себе</label>
                <textarea id="profile-bio" class="glass-input" placeholder="Расскажите о себе..." rows="3"></textarea>
              </div>
              <button class="glass-btn primary" onclick="saveProfile()">Сохранить</button>
            </div>
            <button class="glass-btn danger" onclick="logout()">Выйти</button>
          </div>
        </div>

        <!-- Chat Area -->
        <main id="chat-area" class="chat-area">
          <div id="no-chat-selected" class="no-chat">
            <div class="no-chat-content">
              <img src="/icon-120.png" alt="MQ" class="no-chat-logo">
              <h2>MQ Messenger</h2>
              <p>Выберите чат для начала общения</p>
            </div>
          </div>
          <div id="chat-view" style="display:none">
            <div class="chat-header glass-surface">
              <button class="icon-btn back-btn" onclick="closeChat()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
              <div id="chat-header-avatar" class="avatar-small"></div>
              <div class="chat-header-info">
                <h3 id="chat-header-name"></h3>
                <span id="chat-header-status" class="status-text"></span>
              </div>
              <div class="chat-header-actions">
                <button class="icon-btn" onclick="toggleChatInfo()" title="Информация">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                </button>
              </div>
            </div>
            <div id="messages-container" class="messages-container"></div>
            <div id="typing-indicator" class="typing-indicator" style="display:none">
              <span id="typing-text"></span>
              <div class="typing-dots"><span></span><span></span><span></span></div>
            </div>
            <div class="message-input-area glass-surface">
              <button class="icon-btn" onclick="document.getElementById('file-upload').click()" title="Прикрепить">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.49"/></svg>
              </button>
              <input type="file" id="file-upload" hidden onchange="handleFileUpload(this.files[0])">
              <div class="input-wrapper">
                <textarea id="message-input" class="message-textarea" placeholder="Сообщение..." rows="1" oninput="autoResize(this); handleTyping()" onkeydown="handleInputKeydown(event)"></textarea>
              </div>
              <button id="send-btn" class="icon-btn send-btn" onclick="sendMessage()" title="Отправить">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
              </button>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- New Chat Modal -->
    <div id="new-chat-modal" class="modal" style="display:none">
      <div class="modal-backdrop" onclick="hideNewChatModal()"></div>
      <div class="modal-content glass-card">
        <h3>Новый чат</h3>
        <input type="text" id="new-chat-search" class="glass-input" placeholder="Поиск пользователей..." oninput="searchForNewChat(this.value)">
        <div id="new-chat-results" class="modal-list"></div>
        <div class="modal-actions">
          <button class="glass-btn" onclick="hideNewChatModal()">Отмена</button>
        </div>
      </div>
    </div>

    <!-- Context Menu -->
    <div id="context-menu" class="context-menu" style="display:none"></div>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
