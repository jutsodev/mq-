name: Build iOS App

on:
  push:
    branches: [main, 'devin/**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd MQMessenger
          xcodegen generate

      - name: Resolve Dependencies
        run: |
          cd MQMessenger
          xcodebuild -resolvePackageDependencies \
            -project MQMessenger.xcodeproj \
            -scheme MQMessenger

      - name: Build for iOS Device (arm64)
        run: |
          cd MQMessenger
          xcodebuild build \
            -project MQMessenger.xcodeproj \
            -scheme MQMessenger \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            | tail -50

      - name: Package unsigned IPA
        run: |
          cd MQMessenger
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "MQMessenger.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/DerivedData -name "MQMessenger.app" -type d | head -1)
          fi
          if [ -n "$APP_PATH" ]; then
            echo "Found app at: $APP_PATH"
            file "$APP_PATH/MQMessenger" || true
            mkdir -p build/ipa/Payload
            cp -r "$APP_PATH" build/ipa/Payload/
            cd build/ipa
            zip -r MQMessenger-unsigned.ipa Payload
            echo "IPA created successfully"
            ls -lh MQMessenger-unsigned.ipa
          else
            echo "ERROR: MQMessenger.app not found"
            find build/DerivedData -name "*.app" -type d | head -10
            exit 1
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MQMessenger-unsigned
          path: MQMessenger/build/ipa/MQMessenger-unsigned.ipa
          if-no-files-found: error

  server-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server dependencies
        run: cd server && npm install

      - name: Verify server starts
        run: |
          cd server
          timeout 10 node index.js &
          sleep 3
          curl -f http://localhost:4000/api/health || exit 1
          kill %1 2>/dev/null || true
